name: Generate Events

on:
  push:
    branches:
      - "main"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          path: pages
          ref: gh-pages
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python main.py
      - uses: emilymclean/git-auto-commit-action@master
        with:
          repository: ./pages
          commit_message: "Update Calendar"